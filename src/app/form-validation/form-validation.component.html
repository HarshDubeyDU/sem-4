<div class="container mt-5">
    <h2>User Registration Form</h2>

    <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)" class="w-50 mx-auto">

        <!-- Name Field -->
        <div class="form-group">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                ngModel
                required
                class="form-control"
                [class.is-invalid]="(userForm.touched || userForm.submitted) && userForm.controls?.['name']?.valid"
            />
            <div class="invalid-feedback" *ngIf="userForm.submitted && !userForm.controls?.['name']?.valid">
                Name is required.
            </div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                ngModel
                required
                email
                class="form-control"
                [class.is-invalid]="(userForm.touched || userForm.submitted) && !userForm.controls?.['email']?.valid"
            />
            <div class="invalid-feedback" *ngIf="userForm.submitted && !userForm.controls?.['email']?.valid">
                Please enter a valid email address.
            </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                ngModel
                required
                minlength="6"
                class="form-control"
                [ngClass]="{ 'is-invalid': userForm.submitted && !userForm.controls?.['password']?.valid }"
            />
            <div class="invalid-feedback" *ngIf="userForm.submitted && !userForm.controls?.['password']?.valid">
                Password must be at least 6 characters long.
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary mt-3" [disabled]="userForm.invalid">Submit</button>
    </form>
</div>
